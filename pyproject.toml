[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foundry-cosmosdb-mcp-demo"
version = "0.1.0"
description = "Synthetic healthcare care-guidance vector-search demo for Microsoft Foundry and Azure Cosmos DB."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Rob McKenna" }]
dependencies = [
  "azure-ai-projects>=2.3.0",
  "azure-cosmos>=4.7.0",
  "azure-identity>=1.17.1",
  "openai>=3.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3"
]

[project.scripts]
seed-synthetic-care-guidance = "foundry_cosmos_demo.seeder:main"
run-foundry-cosmos-mcp-demo = "foundry_cosmos_demo.foundry_agent:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
